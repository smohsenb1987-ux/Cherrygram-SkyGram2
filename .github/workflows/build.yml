name: Build Cherrygram SkyGram

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Get the correct reproducible-build branch + submodules
      - name: Clone Cherrygram source
        run: |
          git clone --depth 1 --branch main_Reproducible_Builds \
            --recurse-submodules \
            https://github.com/arsLan4k1390/Cherrygram.git cherrygram

          cd cherrygram

          git submodule sync --recursive
          git submodule update --init --recursive --depth=1

      # 2. Java
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 4. Android dependencies
      - name: Install Android dependencies
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

      # 5. Apply SkyGram / iOS style changes
      - name: Apply SkyGram UI changes
        working-directory: cherrygram
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def find_file(name):
              matches = list(Path(".").rglob(name))
              if not matches:
                  print(f"NOT FOUND: {name}")
                  return None
              print(f"FOUND: {matches[0]}")
              return matches[0]

          def replace_first(path, old, new):
              if path is None or not path.exists():
                  return

              text = path.read_text()

              if old in text:
                  path.write_text(text.replace(old, new, 1))
                  print(f"CHANGED: {path}")
              else:
                  print(f"NOT FOUND IN FILE: {path}")

          # -----------------------------------------
          # Appearance configuration
          # -----------------------------------------

          appearance = find_file("CherrygramAppearanceConfig.kt")

          if appearance:
              text = appearance.read_text()

              replacements = [
                  ("centerTitle = false", "centerTitle = true"),
                  ("showMainTabs = false", "showMainTabs = true"),
                  ("showSearchInTabs = false", "showSearchInTabs = true"),
                  ("showMainTabsTitle = false", "showMainTabsTitle = true"),
              ]

              for old, new in replacements:
                  if old in text:
                      text = text.replace(old, new, 1)
                      print(f"CHANGED: {old}")

              appearance.write_text(text)

          # -----------------------------------------
          # Chats configuration
          # -----------------------------------------

          chats = find_file("CherrygramChatsConfig.kt")

          if chats:
              text = chats.read_text()

              replacements = [
                  ("iOSMessageInputField = false",
                   "iOSMessageInputField = true"),

                  ("centerChatTitle = false",
                   "centerChatTitle = true"),
              ]

              for old, new in replacements:
                  if old in text:
                      text = text.replace(old, new, 1)
                      print(f"CHANGED: {old}")

              chats.write_text(text)

          # -----------------------------------------
          # Bottom navigation
          # -----------------------------------------

          dialogs = find_file("DialogsActivity.java")

          if dialogs:
              text = dialogs.read_text()

              if "MAIN_TABS_HEIGHT = 56" in text:
                  text = text.replace(
                      "MAIN_TABS_HEIGHT = 56",
                      "MAIN_TABS_HEIGHT = 60",
                      1
                  )
                  print("CHANGED: MAIN_TABS_HEIGHT")

              if "MAIN_TABS_MARGIN = dp(6)" in text:
                  text = text.replace(
                      "MAIN_TABS_MARGIN = dp(6)",
                      "MAIN_TABS_MARGIN = dp(8)",
                      1
                  )
                  print("CHANGED: MAIN_TABS_MARGIN")

              dialogs.write_text(text)

          # -----------------------------------------
          # Glass navigation
          # -----------------------------------------

          glass = find_file("GlassTabView.java")

          if glass:
              text = glass.read_text()

              if "setTextSize(12)" in text:
                  text = text.replace(
                      "setTextSize(12)",
                      "setTextSize(12.5f)",
                      1
                  )
                  print("CHANGED: glass text size")

              if "Theme.multAlpha(colorSelected, 0.09f * alpha)" in text:
                  text = text.replace(
                      "Theme.multAlpha(colorSelected, 0.09f * alpha)",
                      "Theme.multAlpha(colorSelected, 0.16f * alpha)",
                      1
                  )
                  print("CHANGED: glass selected background")

              if "lerp(0.6f, 1, selectedFactor)" in text:
                  text = text.replace(
                      "lerp(0.6f, 1, selectedFactor)",
                      "lerp(0.88f, 1, selectedFactor)",
                      1
                  )
                  print("CHANGED: selected tab scale")

              glass.write_text(text)

          # -----------------------------------------
          # Floating navigation width
          # -----------------------------------------

          main_tabs = find_file("MainTabsActivity.java")

          if main_tabs:
              text = main_tabs.read_text()

              text = text.replace(
                  "dp(328 + DialogsActivity.MAIN_TABS_MARGIN * 2)",
                  "dp(520 + DialogsActivity.MAIN_TABS_MARGIN * 2)",
                  1
              )

              text = text.replace(
                  "DialogsActivity.MAIN_TABS_MARGIN + 4",
                  "DialogsActivity.MAIN_TABS_MARGIN + 2",
              )

              main_tabs.write_text(text)

              print("CHANGED: MainTabsActivity")

          print("")
          print("================================")
          print("SkyGram UI changes completed.")
          print("================================")
          PY

      # 6. Prepare CI files
      - name: Prepare CI environment
        working-directory: cherrygram
        run: |
          touch secrets_for_ci.env

      # 7. Create temporary signing key
      - name: Create signing key
        working-directory: cherrygram
        run: |
          keytool -genkeypair \
            -v \
            -keystore Your_Key.jks \
            -storepass Your_Password \
            -keypass Your_Password \
            -alias Your_Alias \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Cherrygram"

      # 8. Configure signing in every Android module
      - name: Configure signing
        working-directory: cherrygram
        shell: python3 {0}
        run: |
          from pathlib import Path

          files = [
              Path("TMessagesProj_App/build.gradle"),
              Path("TMessagesProj_AppHuawei/build.gradle"),
              Path("TMessagesProj_AppStandalone/build.gradle"),
          ]

          for p in files:
              if not p.exists():
                  print(f"SKIP: {p}")
                  continue

              text = p.read_text()

              text = text.replace(
                  "storeFile file('../Your_Key.jks')",
                  "storeFile file('../Your_Key.jks')"
              )

              text = text.replace(
                  "storePassword 'Your_Password'",
                  "storePassword 'Your_Password'"
              )

              text = text.replace(
                  "keyAlias 'Your_Alias'",
                  "keyAlias 'Your_Alias'"
              )

              text = text.replace(
                  "keyPassword 'Your_Password'",
                  "keyPassword 'Your_Password'"
              )

              p.write_text(text)

              print(f"Signing checked: {p}")

      # 9. 
