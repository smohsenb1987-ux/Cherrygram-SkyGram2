name: Build Cherrygram SkyGram

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================
      # 1 - دریافت نسخه مناسب Cherrygram
      # ============================================
      - name: Clone Cherrygram
        run: |
          git clone \
            --depth 1 \
            --branch main_Reproducible_Builds \
            --recurse-submodules \
            https://github.com/arsLan4k1390/Cherrygram.git \
            cherrygram

          cd cherrygram

          git submodule sync --recursive
          git submodule update --init --recursive

          echo "================================"
          echo "Cherrygram source ready"
          echo "================================"

          git branch --show-current
          git rev-parse HEAD
          git submodule status --recursive


      # ============================================
      # 2 - Java 17
      # ============================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ============================================
      # 3 - Android SDK
      # ============================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ============================================
      # 4 - Android / NDK / CMake
      # ============================================
      - name: Install Android dependencies
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"


      # ============================================
      # 5 - بررسی Native Source
      # ============================================
      - name: Check native source
        working-directory: cherrygram
        run: |
          echo "===== JNI ====="
          ls -la TMessagesProj/jni

          echo "===== CMAKE ====="

          if [ -f TMessagesProj/jni/CMakeLists.txt ]; then
            echo "CMakeLists.txt OK"
          else
            echo "CMakeLists.txt missing"
            exit 1
          fi

          echo "===== SUBMODULES ====="
          git submodule status --recursive


      # ============================================
      # 6 - اعمال تنظیمات SkyGram / iOS
      # ============================================
      - name: Apply SkyGram UI
        working-directory: cherrygram
        shell: bash
        run: |

          python3 <<'PY'

          from pathlib import Path

          # ==================================================
          # CherrygramChatsConfig.kt
          # فعال کردن قابلیت‌های iOS
          # ==================================================

          p = Path(
              "TMessagesProj/src/main/java/"
              "org/telegram/ui/Components/"
              "config/CherrygramChatsConfig.kt"
          )

          if not p.exists():
              candidates = list(
                  Path("TMessagesProj/src/main/java").rglob(
                      "CherrygramChatsConfig.kt"
                  )
              )

              if candidates:
                  p = candidates[0]

          if p.exists():

              text = p.read_text()

              text = text.replace(
                  "iOSMessageInputField = false",
                  "iOSMessageInputField = true"
              )

              text = text.replace(
                  "centerChatTitle = false",
                  "centerChatTitle = true"
              )

              p.write_text(text)

              print("CherrygramChatsConfig updated")


          # ==================================================
          # CherrygramAppearanceConfig.kt
          # ظاهر iOS / Main Tabs
          # ==================================================

          candidates = list(
              Path("TMessagesProj/src/main/java").rglob(
                  "CherrygramAppearanceConfig.kt"
              )
          )

          if candidates:

              p = candidates[0]
              text = p.read_text()

              text = text.replace(
                  "centerTitle = false",
                  "centerTitle = true"
              )

              text = text.replace(
                  "showMainTabs = false",
                  "showMainTabs = true"
              )

              text = text.replace(
                  "showSearchInTabs = false",
                  "showSearchInTabs = true"
              )

              text = text.replace(
                  "showMainTabsTitle = false",
                  "showMainTabsTitle = true"
              )

              p.write_text(text)

              print("CherrygramAppearanceConfig updated")


          # ==================================================
          # DialogsActivity.java
          # Bottom navigation
          # ==================================================

          candidates = list(
              Path("TMessagesProj/src/main/java").rglob(
                  "DialogsActivity.java"
              )
          )

          if candidates:

              p = candidates[0]
              text = p.read_text()

              # ارتفاع Bottom Bar
              text = text.replace(
                  "MAIN_TABS_HEIGHT = 56",
                  "MAIN_TABS_HEIGHT = 60"
              )

              # فاصله از لبه
              text = text.replace(
                  "MAIN_TABS_MARGIN = 6",
                  "MAIN_TABS_MARGIN = 8"
              )

              p.write_text(text)

              print("DialogsActivity updated")


          # ==================================================
          # GlassTabView.java
          # ظاهر Glass / Liquid Glass
          # ==================================================

          candidates = list(
              Path("TMessagesProj/src/main/java").rglob(
                  "GlassTabView.java"
              )
          )

          if candidates:

              p = candidates[0]
              text = p.read_text()

              text = text.replace(
                  "setTextSize(12)",
                  "setTextSize(12.5f)"
              )

              p.write_text(text)

              print("GlassTabView updated")


          # ==================================================
          # MainTabsActivity.java
          # Search Glass button
          # ==================================================

          candidates = list(
              Path("TMessagesProj/src/main/java").rglob(
                  "MainTabsActivity.java"
              )
          )

          if candidates:

              p = candidates[0]
              text = p.read_text()

              # کمی فاصله بیشتر برای حالت شناور
              text = text.replace(
                  "dp(6)",
                  "dp(8)"
              )

              p.write_text(text)

              print("MainTabsActivity updated")


          print("========================================")
          print("SkyGram / iOS UI changes applied")
          print("========================================")

          PY


      # ============================================
      # 7 - بررسی اینکه تغییرات واقعاً اعمال شده
      # ============================================
      - name: Verify SkyGram changes
        working-directory: cherrygram
        run: |
          echo "===== iOS Message Input ====="
          grep -R "iOSMessageInputField" TMessagesProj/src/main/java | head -10 || true

          echo "===== Center Chat Title ====="
          grep -R "centerChatTitle" TMessagesProj/src/main/java | head -10 || true

          echo "===== Glass Tab ====="
          find TMessagesProj/src/main/java \
            -name "GlassTabView.java" \
            -print

          echo "===== Main Tabs ====="
          find TMessagesProj/src/main/java \
            -name "MainTabsActivity.java" \
            -print


      # ============================================
      # 8 - CI files
      # ============================================
      - name: Prepare CI
        working-directory: cherrygram
        run: |
          touch secrets_for_ci.env
          chmod +x gradlew


      # ============================================
      # 9 - ساخت کلید امضا
      # ============================================
      - name: Create signing key
        working-directory: cherrygram
        run: |
          keytool -genkeypair \
            -v \
            -keystore Your_Key.jks \
            -storepass Your_Password \
            -keypass Your_Password \
            -alias Your_Alias \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Cherrygram SkyGram, OU=SkyGram, O=SkyGram, L=Baku, ST=Baku, C=AZ"

          echo "Signing key created."


      # ============================================
      # 10 - Build APK
      # ============================================
      - name: Build APK
        working-directory: cherrygram
        shell: bash
        run: |

          chmod +x gradlew

          echo "========================================"
          echo "STARTING CHERRYGRAM SKYGRAM BUILD"
          echo "========================================"

          set -o pipefail

          ./gradlew \
            :TMessagesProj_App:assembleAfatDebug \
            --no-daemon \
            --stacktrace \
            2>&1 | tee build.log


      # ============================================
      # 11 - نمایش APKهای ساخته‌شده
      # ============================================
      - name: Find APK
        if: always()
        working-directory: cherrygram
        run: |
          echo "========================================"
          echo "APK FILES"
          echo "========================================"

          find . \
            -type f \
            -name "*.apk" \
            -print


      # ============================================
      # 12 - آپلود APK
      # ============================================
      - name: Upload SkyGram APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Cherrygram-SkyGram-APK
          path: |
            cherrygram/**/build/outputs/apk/**/*.apk
          if-no-files-found: error


      # ============================================
      # 13 - اگر خطا شد، لاگ را نگه دار
      # ============================================
      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cherrygram-Build-Log
          path: |
            cherrygram/build.log
          if-no-files-found: warn
