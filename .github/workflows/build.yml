name: Build Cherrygram SkyGram

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Clone Cherrygram source
        run: |
          git clone --depth 1 https://github.com/arsLan4k1390/Cherrygram.git cherrygram
          cd cherrygram
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android dependencies
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Apply SkyGram UI changes
        working-directory: cherrygram
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_if_found(path, old, new):
              p = Path(path)

              if not p.exists():
                  print("SKIP file:", path)
                  return

              text = p.read_text()

              if old in text:
                  p.write_text(text.replace(old, new, 1))
                  print("OK changed:", path)
              else:
                  print("SKIP text not found:", path)

          # Bottom navigation size
          replace_if_found(
              "TMessagesProj/src/main/java/org/telegram/ui/DialogsActivity.java",
              "public static final int MAIN_TABS_HEIGHT = 56;\n    public static final int MAIN_TABS_MARGIN = dp(6);",
              "public static final int MAIN_TABS_HEIGHT = 60;\n    public static final int MAIN_TABS_MARGIN = dp(8);"
          )

          # Glass navigation text
          replace_if_found(
              "TMessagesProj/src/main/java/org/telegram/ui/Components/glass/GlassTabView.java",
              "textView.setTextSize(TypedValue.COMPLEX_UNIT_DIP, 12f);",
              "textView.setTextSize(TypedValue.COMPLEX_UNIT_DIP, 12f);\n        textView.setIncludeFontPadding(false);"
          )

          # Selected glass capsule
          replace_if_found(
              "TMessagesProj/src/main/java/org/telegram/ui/Components/glass/GlassTabView.java",
              "Theme.multAlpha(colorSelected, 0.09f * alpha)",
              "Theme.multAlpha(colorSelected, 0.16f * alpha)"
          )

          # Selected tab scale
          replace_if_found(
              "TMessagesProj/src/main/java/org/telegram/ui/Components/glass/GlassTabView.java",
              "lerp(0.6f, 1, selectedFactor)",
              "lerp(0.88f, 1, selectedFactor)"
          )

          # Wider floating navigation
          replace_if_found(
              "TMessagesProj/src/main/java/org/telegram/ui/MainTabsActivity.java",
              "tabsView.setMaxWidth(dp(328 + DialogsActivity.MAIN_TABS_MARGIN * 2));",
              "tabsView.setMaxWidth(dp(520 + DialogsActivity.MAIN_TABS_MARGIN * 2));"
          )

          # Smaller side padding
          replace_if_found(
              "TMessagesProj/src/main/java/org/telegram/ui/MainTabsActivity.java",
              "tabsView.setPadding(DialogsActivity.MAIN_TABS_MARGIN + 4, 0, DialogsActivity.MAIN_TABS_MARGIN + 4, 0);",
              "tabsView.setPadding(DialogsActivity.MAIN_TABS_MARGIN + 2, 0, DialogsActivity.MAIN_TABS_MARGIN + 2, 0);"
          )

          # SkyGram-style default tab order
          replace_if_found(
              "TMessagesProj/src/main/java/uz/unnarsx/cherrygram/core/configs/CherrygramAppearanceConfig.kt",
              '"SETTINGS,CHATS,!PROFILE,!CONTACTS,!CALLS,SEARCH"',
              '"CONTACTS,CALLS,CHATS,SETTINGS,!PROFILE,SEARCH"'
          )

          print("SkyGram changes finished.")
          PY

      - name: Prepare CI environment
        working-directory: cherrygram
        run: |
          touch secrets_for_ci.env

      - name: Create signing key
        working-directory: cherrygram
        run: |
          keytool -genkeypair -v \
            -keystore Your_Key.jks \
            -storepass Your_Password \
            -keypass Your_Password \
            -alias Your_Alias \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Cherrygram Test"

      - name: Verify native sources
        working-directory: cherrygram
        run: |
          echo "===== JNI DIRECTORY ====="
          ls -la TMessagesProj/jni/

          echo "===== CHECK COLORADO ====="
          if [ -f TMessagesProj/jni/colorado/CMakeLists.txt ]; then
            echo "Colorado CMakeLists.txt FOUND"
          else
            echo "ERROR: Colorado CMakeLists.txt NOT FOUND"
            exit 1
          fi

      - name: Build APK
        working-directory: cherrygram
        run: |
          chmod +x gradlew
          set +e
          ./gradlew :TMessagesProj_App:assembleAfatDebug --no-daemon --stacktrace 2>&1 | tee build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "Gradle exit code: $BUILD_EXIT"
          exit $BUILD_EXIT

      - name: Show build log
        if: always()
        working-directory: cherrygram
        run: |
          echo "===== LAST 200 LINES OF BUILD LOG ====="
          if [ -f build.log ]; then
            tail -n 200 build.log
          else
            echo "build.log was not created"
          fi

      - name: Find APK
        if: always()
        working-directory: cherrygram
        run: |
          echo "===== APK FILES ====="
          find . -type f -name "*.apk" -print

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cherrygram-Build-Log
          path: cherrygram/build.log
          if-no-files-found: warn

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Cherrygram-SkyGram-APK
          path: cherrygram/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
